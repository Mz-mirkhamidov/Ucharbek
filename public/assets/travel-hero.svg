<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003594"/>
      <stop offset="40%" stop-color="#0054DF"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="92%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#F9CB02"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5A5"/>
      <stop offset="100%" stop-color="#F9CB02"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#003594"/>
    </linearGradient>
    <linearGradient id="planeBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Golden Sun on Horizon -->
  <circle cx="400" cy="450" r="140" fill="url(#sunGrad)" opacity="0.85" filter="url(#glow)"/>

  <!-- Ocean Water Base -->
  <rect y="460" width="800" height="140" fill="url(#seaGrad)"/>

  <!-- Water Reflection Highlights -->
  <ellipse cx="400" cy="475" rx="160" ry="8" fill="#FFF" opacity="0.3"/>
  <ellipse cx="400" cy="495" rx="120" ry="6" fill="#F9CB02" opacity="0.4"/>
  <ellipse cx="400" cy="520" rx="90" ry="5" fill="#FFF" opacity="0.25"/>

  <!-- Tropical Islands & Resort Silhouettes -->
  <path d="M 0 460 Q 120 420 250 460 Z" fill="#0f2b5c"/>
  <path d="M 550 460 Q 680 430 800 460 Z" fill="#0f2b5c"/>

  <!-- Palm Trees (Left) -->
  <g transform="translate(90, 460) scale(0.65)">
    <path d="M 20 0 Q 30 -60 40 -120 Q 42 -122 45 -120 Q 35 -60 30 0 Z" fill="#071836"/>
    <!-- Palm Fronds -->
    <path d="M 40 -120 Q -20 -150 -60 -120 Q -20 -130 40 -120" fill="#0b244d"/>
    <path d="M 40 -120 Q 10 -190 -10 -210 Q 20 -170 40 -120" fill="#0b244d"/>
    <path d="M 40 -120 Q 70 -200 95 -195 Q 75 -165 40 -120" fill="#0b244d"/>
    <path d="M 40 -120 Q 110 -160 140 -130 Q 95 -135 40 -120" fill="#0b244d"/>
  </g>

  <!-- Modern Jetliner Climbing Skyward -->
  <g transform="translate(360, 210) rotate(-18)">
    <!-- Jet Trail / Contrail -->
    <path d="M -300 35 L -10 35" stroke="#FFFFFF" stroke-width="4" opacity="0.4" stroke-linecap="round" stroke-dasharray="12 6"/>
    
    <!-- Wing Back Shadow -->
    <polygon points="-20,38 70,5 50,38" fill="#94a3b8"/>
    
    <!-- Fuselage Main Body -->
    <ellipse cx="60" cy="35" rx="140" ry="24" fill="url(#planeBodyGrad)"/>
    
    <!-- Cockpit Glass -->
    <path d="M 170 30 Q 185 35 178 40 L 165 40 Q 168 33 170 30 Z" fill="#0054DF"/>
    
    <!-- Cabin Windows (Ucharbek Yellow Glow) -->
    <g fill="#F9CB02">
      <circle cx="20" cy="32" r="3.5"/>
      <circle cx="35" cy="32" r="3.5"/>
      <circle cx="50" cy="32" r="3.5"/>
      <circle cx="65" cy="32" r="3.5"/>
      <circle cx="80" cy="32" r="3.5"/>
      <circle cx="95" cy="32" r="3.5"/>
      <circle cx="110" cy="32" r="3.5"/>
      <circle cx="125" cy="32" r="3.5"/>
      <circle cx="140" cy="32" r="3.5"/>
    </g>
    
    <!-- Main Wing Foreground -->
    <polygon points="20,38 100,120 70,120 0,38" fill="#e2e8f0"/>
    <polygon points="85,115 100,120 95,98" fill="#F9CB02"/> <!-- Winglet Gold -->

    <!-- Tail Fin (with Ucharbek Blue and Gold Accents) -->
    <polygon points="-55,30 -95,-45 -65,-45 -25,30" fill="#0054DF"/>
    <polygon points="-90,-35 -95,-45 -65,-45 -70,-35" fill="#F9CB02"/>

    <!-- Jet Engine -->
    <ellipse cx="40" cy="68" rx="24" ry="12" fill="#64748b"/>
    <ellipse cx="58" cy="68" rx="8" ry="11" fill="#0054DF"/>
  </g>

  <!-- Flight Path Dashed Line -->
  <path d="M 50 500 Q 220 400 420 270 T 750 80" fill="none" stroke="#F9CB02" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.75"/>
  
  <!-- Star sparkles in sky -->
  <circle cx="680" cy="90" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="720" cy="140" r="2" fill="#FFF" opacity="0.7"/>
  <circle cx="220" cy="110" r="2.5" fill="#FFF" opacity="0.8"/>
  <circle cx="140" cy="180" r="2" fill="#FFF" opacity="0.6"/>
</svg>
